name: "Slipmark verify"
description: "Refuse to ship unless every AI agent verdict matches the exact files it read (SHA-256 attestation gate)."
author: "Reply Intelligence Group"
branding:
  icon: "hash"
  color: "gray-dark"

inputs:
  dir:
    description: "Directory of attestation files, relative to the repository root."
    required: false
    default: ".slipmark/attestations"
  require:
    description: "Files that must be covered by a passing, current attestation. One path per line."
    required: false
    default: ""
  working-directory:
    description: "Repository root to verify against."
    required: false
    default: "."
  coverage-base:
    description: "Require a current, passing verdict for every file changed since this ref, for example 'origin/main'. Needs actions/checkout with fetch-depth: 0. Overrides coverage in .slipmark/policy.json."
    required: false
    default: ""
  coverage-ignore:
    description: "Globs left out of coverage, one per line, for example 'docs/**'. .slipmark/** is always left out."
    required: false
    default: ""
  policy-from:
    description: "Where to read .slipmark/policy.json. Default: the pull request's base branch (fetched for you), so a PR can't loosen the rules it is judged by. A ref such as 'origin/main', or 'working-tree' for the checkout (the v0.4 behaviour)."
    required: false
    default: ""
  require-signed:
    description: "Only count verdicts signed (with 'slipmark attest --sign') by one of trusted-signers. Overrides signatures.require in .slipmark/policy.json."
    required: false
    default: "false"
  trusted-signers:
    description: "Signer identities to trust, one per line, for example 'https://github.com/acme/api/.github/workflows/agent-review.yml@refs/heads/main'. '*' matches anything."
    required: false
    default: ""
  github-token:
    description: "Token for checking changed agent context files against GitHub's own Markdown renderer (with a context section in the policy). The job's token is enough."
    required: false
    default: ${{ github.token }}
  fail-on-refusal:
    description: "Fail the step when the gate refuses. Set to 'false' to report only while you roll Slipmark out."
    required: false
    default: "true"
  cloud:
    description: "Record this run in Slipmark Cloud's append-only ledger and link a proof page from the job summary. Needs 'permissions: id-token: write' on the job. Never changes the gate result."
    required: false
    default: "false"
  cloud-url:
    description: "Override the Slipmark Cloud ingest URL."
    required: false
    default: ""

outputs:
  result:
    description: "'passed' or 'refused'."
    value: ${{ steps.verify.outputs.result }}
  proof-url:
    description: "Link to this run's Slipmark Cloud proof page (public repositories, when cloud is 'true')."
    value: ${{ steps.verify.outputs.proof-url }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
    - name: Build Slipmark
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build
    - name: Verify attestations
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DG_DIR: ${{ inputs.dir }}
        DG_REQUIRE: ${{ inputs.require }}
        DG_COV_BASE: ${{ inputs.coverage-base }}
        DG_COV_IGNORE: ${{ inputs.coverage-ignore }}
        DG_POLICY_FROM: ${{ inputs.policy-from }}
        DG_FAIL: ${{ inputs.fail-on-refusal }}
        DG_REQ_SIGNED: ${{ inputs.require-signed }}
        DG_SIGNERS: ${{ inputs.trusted-signers }}
        DG_CLOUD: ${{ inputs.cloud }}
        DG_CLOUD_URL: ${{ inputs.cloud-url }}
        DG_CLI: ${{ github.action_path }}/dist/src/cli.js
        SLIPMARK_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        args=(verify --dir "$DG_DIR")
        if [ -n "$DG_POLICY_FROM" ]; then
          args+=(--policy-from "$DG_POLICY_FROM")
        elif [ -n "$GITHUB_BASE_REF" ]; then
          # The policy is read from the branch being merged into. A default shallow
          # checkout doesn't have it, so fetch just that branch tip. Never deepen a
          # full clone: only fetch when the base isn't already there.
          if ! git show-ref --verify --quiet "refs/remotes/origin/$GITHUB_BASE_REF"; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" >/dev/null 2>&1 \
              || echo "::warning title=Slipmark::Couldn't fetch the base branch $GITHUB_BASE_REF. The policy will be read from this branch, which the pull request can edit."
          fi
        fi
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -n "$line" ] && args+=(--require "$line")
        done <<< "$DG_REQUIRE"
        if [ -n "$DG_COV_BASE" ]; then
          args+=(--coverage diff --base "$DG_COV_BASE")
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -n "$line" ] && args+=(--ignore "$line")
          done <<< "$DG_COV_IGNORE"
        fi
        [ "$DG_REQ_SIGNED" = "true" ] && args+=(--require-signed)
        while IFS= read -r line; do
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -n "$line" ] && args+=(--trusted-signer "$line")
        done <<< "$DG_SIGNERS"
        set +e
        node "$DG_CLI" "${args[@]}"
        code=$?
        if [ "$DG_CLOUD" = "true" ]; then
          up=(upload "${args[@]:1}")
          [ -n "$DG_CLOUD_URL" ] && up+=(--url "$DG_CLOUD_URL")
          node "$DG_CLI" "${up[@]}"
        fi
        set -e
        if [ "$code" -eq 0 ]; then
          echo "result=passed" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "result=refused" >> "$GITHUB_OUTPUT"
        if [ "$code" -ne 1 ]; then
          echo "::error title=Slipmark::verify could not run (exit $code)"
          exit "$code"
        fi
        if [ "$DG_FAIL" = "false" ]; then
          echo "::warning title=Slipmark::Gate refused (report-only mode, not failing the build)"
          exit 0
        fi
        exit 1
